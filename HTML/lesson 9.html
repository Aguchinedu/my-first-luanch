<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .red{
        background-color: red;
        width: 300px;
        height: 300px;
    }
     .green{
        background-color: green;
        width: 300px;
        height: 300px;
        border-radius: 150px;
    }
    .quest{
        /* background-color: black; */
        /* border-color: yellow; */
        /* color: white; */
        width: 300px;
        height: 80px;
        border: 1px solid black;

        /* margin-top: 5px; */
    }
    .sat{
        /* margin-top: 20px;  */
        /* padding-top: 1px; */
        padding-left: 10px; 
        padding-bottom: 0px;
        margin-bottom: 7px;
        font-weight: bold;
    }
    .b1{
        /* padding-left: 10p; */
        margin-left: 10px;
        margin-top: 0;
    }
    .quest2{
        width: 350px;
        height: 100px;
        color: white;
        background-color: rgb(22, 21, 21);
    }
    .h1{
        font-size: 25px;
        font-weight: bold;
        margin-top: 30px;
        margin-bottom: 7px;
        padding-top: 10px;
        padding-left: 10px;
        
    }
    .h2{
        padding-left: 10px;
        margin-top: 0px;
        color: rgb(145, 132, 132);
    }
    .nar{
        margin-top: 5px;
        margin-left: 5px;
        width: 40px;
        height: 40px;
        border-radius: 55px;
        object-position: center;
        vertical-align: middle;
    }
    .quest3{
        width: 330px;
        height: 50px;
        box-shadow: 0px 0px 5px  rgba(0, 0, 0, 0.7);
        border-radius: 4px;
    }
    .nar-bar{
        /* margin-top: 5px; */
        height: 30px;
        width: 200px;
        padding-top: 1px;
        padding-left: 7px;
        border: none;
    }
    .nar-but{
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 12px;
        padding-right: 12px;
        border-radius: 15px;
        border: none;
        color: white;
        background-color: rgb(16, 117, 240);
    }
</style>
<body>
    <div class="red">

    </div>
    <div class="green"></div>

    <div class="quest">
        <p class="sat">Satisfied with our services?</p>
        <button class="b1">yes</button>
        <button class="b2">no</button>
    </div>
    <div class="quest2">
        <p class="h1">Install YouTube Music</p>
        <p class="h2">Add youtube music to your desktop for quick and easy access</p>
    </div><br><br>

    <div class="quest3">
        <img class="nar" src="download (1).jpg" alt="">
        <input class="nar-bar" type="text" placeholder="What's happening?">
        <button class="nar-but">Tweet</button>


    </div>
</body>
</html>
