<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>image bending</title>
  <style>
    .naruto{
      width: 200px;
      border-radius: 10px;
    }
    .naruto2{
      width: 200px;
      border-radius: 100px;
      height: 200px;
      object-fit: cover;
      object-position: center;
    }
    .naruto3{
      width: 200px;
      border-radius: 150px;
      
    }

    .search1{
      border-radius: 5px;
      border-width: 1px;
      border-color: gainsboro;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 16px;
      padding-right: 16px;
    }

    .search2{
      padding-top: 7px;
      padding-bottom: 7px;
      padding-left: 12px;
      padding-right: 200px;
      border-radius: 15px;
      border: none;
    box-shadow: 2px 1px 5px rgba( 0, 0, 0, 0.15);
    }
    .em{
      color: grey;
      margin-bottom: 3px;
    }
    .input1{
      padding-top: 4px;
      padding-bottom: 4px;
      padding-left: 12px;
      padding-right: 200px;
      border-color: gray;
      border-radius: 4px;
    }
    .word{
      color: grey;      
    }
    .btn{
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 140px;
      padding-right: 140px;
      margin-left: 7px;
      background-color: rgb(9, 70, 155);
      border: none;
      border-radius: 20px;
      color: white;
      margin-bottom: 0px;
    }
    .naruto4{
      margin-top: 30px;
      width: 40px;
      height: 40px;
      border-radius: 30px;
      object-position: center;
      margin-bottom: 0;
    }
    .quest{
      margin-bottom: 0px;
      margin-top: 0px;
      margin-left: 200px;
      margin-right: 500px;
      padding-top: 20px;
      padding-bottom: 0px;
      padding-left: 16px;
      padding-right: 16px;
      /* vertical-align: top; */
    }
  </style>
</head>
<body>
  <h1>exercise 1</h1>
  <img class="naruto" src="download (1).jpg">
    <img class="naruto2" src="download (1).jpg">
      <img class="naruto3" src="download (1).jpg">
  <h1>exercise 2</h1>
  <input type="text" class="search1" placeholder="Search">
  <input type="text" class="search2" placeholder="Search Google or type URL">
  <h1>mini project 1</h1>
  <p class="em">Email</p>
  <input type="text" class="input1">
  <p class="word">By clicking Agree & Join, you agree to the Privacy Policy.</p>
  <button class="btn">Agree & Join</button>
  
  <input type="text" class="quest" placeholder="What's happening?"> <button class="btn2">tweet</button>
  <img src="download (1).jpg" class="naruto4">

</body>
</html>
